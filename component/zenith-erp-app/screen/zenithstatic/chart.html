<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ZetaERP Chart</title>
    <script src="/zenithstatic/js/chart.umd.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #chart-container { width: 100%; height: 100%; position: relative; }
    </style>
</head>
<body>
    <div id="chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var type = urlParams.get('type');
            var ctx = document.getElementById('myChart').getContext('2d');
            
            if (type === 'mtd') {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'],
                        datasets: [{
                            label: 'Daily Sales (₹)',
                            data: [12000, 15000, 13500, 18000, 14200, 19000, 22000, 21000, 17500, 14250],
                            backgroundColor: '#4F46E5',
                            borderRadius: 4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            } else if (type === 'trend') {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                        datasets: [{
                            label: 'Monthly Revenue',
                            data: [350000, 380000, 320000, 410000, 450000, 432000],
                            borderColor: '#10B981',
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(16, 185, 129, 0.1)'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        };
    </script>
</body>
</html>
