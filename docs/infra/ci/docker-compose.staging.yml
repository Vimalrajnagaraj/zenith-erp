# Ephemeral STAGING stack for CI acceptance (Phase 1). NOT production.
# Throwaway passwords, fresh volume, torn down after each run. OpenSearch is omitted to keep the
# runner light; search-backed screens are therefore out of the render-smoke scope for now.
#
# The moqui image is built by the workflow from docs/infra/deploy/Dockerfile and tagged
# zetaerp-moqui:staging. Brought up with:  docker compose -f docs/infra/ci/docker-compose.staging.yml up -d
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: moqui
      POSTGRES_USER: moqui
      POSTGRES_PASSWORD: staging_only   # throwaway; must match entity_ds_password below
      TZ: Asia/Kolkata
    # no named volume: the container's own layer is fine for a disposable stack
    tmpfs:
      - /var/lib/postgresql/data        # RAM-backed → fast + nothing to clean up
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moqui -d moqui"]
      interval: 5s
      timeout: 5s
      retries: 20

  moqui:
    image: zetaerp-moqui:staging         # built by the workflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=Asia/Kolkata
      - entity_ds_db_conf=postgres
      - entity_ds_host=db
      - entity_ds_port=5432
      - entity_ds_database=moqui
      - entity_ds_user=moqui
      - entity_ds_password=staging_only  # must match db POSTGRES_PASSWORD
      # No elasticsearch_url: run without OpenSearch for the smoke (search features degrade, render is fine).
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1792m -Dbitronix.tm.serverId=zetaerp-staging -Duser.timezone=Asia/Kolkata -Ddefault_time_zone=Asia/Kolkata
    ports:
      - "8080:8080"
    mem_limit: 2560m
