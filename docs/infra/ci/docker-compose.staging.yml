# Ephemeral STAGING stack for CI acceptance (Phase 1). NOT production.
# Throwaway passwords, fresh volume, torn down after each run. OpenSearch is omitted to keep the
# runner light; search-backed screens are therefore out of the render-smoke scope for now.
#
# The moqui image is NOT built here — it is the repo's sanitized prebuilt app image, published as
# the `staging-image-v1` release asset and loaded + tagged zetaerp-moqui:staging by the workflow
# (the upstream GHCR base is 403-blocked, so we build from a copy we control). The workflow then
# overlays the checked-out component tree onto it. Up with:
#   docker compose -f docs/infra/ci/docker-compose.staging.yml up -d
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: moqui
      POSTGRES_USER: moqui
      POSTGRES_PASSWORD: staging_only   # throwaway; must match entity_ds_password below
      TZ: Asia/Kolkata
    # no named volume: the container's own layer is fine for a disposable stack
    tmpfs:
      - /var/lib/postgresql/data        # RAM-backed → fast + nothing to clean up
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moqui -d moqui"]
      interval: 5s
      timeout: 5s
      retries: 20

  moqui:
    image: zetaerp-moqui:staging         # built by the workflow
    depends_on:
      db:
        condition: service_healthy
    # Hold the container up but DO NOT start the web server until the data load is done; the workflow
    # touches /tmp/ci-start-web to release it. Web and the `docker exec` load JVM share one Bitronix
    # tx-log (/opt/moqui/runtime/txlog/btm*.tlog); if web boots first it holds the lock and the load
    # dies at ECF init ("btm*.tlog is locked"). Web then takes over PID1 via `exec` with the image's
    # real production command, so its logs still reach `docker compose logs`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /opt/moqui
        echo "CI: container up, web HELD off until data load completes (waiting for /tmp/ci-start-web)"
        while [ ! -f /tmp/ci-start-web ]; do sleep 1; done
        echo "CI: sentinel seen -> starting production web"
        exec /__cacert_entrypoint.sh java -cp . MoquiStart conf=conf/MoquiProductionConf.xml
    environment:
      - TZ=Asia/Kolkata
      - entity_ds_db_conf=postgres
      - entity_ds_host=db
      - entity_ds_port=5432
      - entity_ds_database=moqui
      - entity_ds_user=moqui
      - entity_ds_password=staging_only  # must match db POSTGRES_PASSWORD
      # DISABLE OpenSearch. The prebuilt image BAKES `ENV elasticsearch_url=http://opensearch:9200`
      # (prod has a real deploy-opensearch-1); that host doesn't exist in CI. Setting it EMPTY makes
      # Moqui skip the elastic cluster entirely (no client), so entity index-on-save is a no-op.
      # Without this the demo load tolerates the unreachable host (no DataDocuments at cold start)
      # but a SECOND data load does not — saving a Party then tries to index to the dead host and
      # throws. Empty = disabled is the clean fix; search-backed screens degrade, render is fine.
      - elasticsearch_url=
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1792m -Dbitronix.tm.serverId=zetaerp-staging -Duser.timezone=Asia/Kolkata -Ddefault_time_zone=Asia/Kolkata
    ports:
      - "8080:8080"
    mem_limit: 2560m
