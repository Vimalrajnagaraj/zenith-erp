user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Upstream with keepalive to Moqui backend
    upstream moqui_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Cold-boot fix: a SEPARATE upstream for STATIC assets only. Lists the same backend twice with
    # max_fails=0 so nginx can RETRY a transient 500 without ever marking the (single) backend down.
    # The 500 being retried is a Jetty "IllegalStateException: Invalid for read" session-concurrency
    # race that hits the SPA's core JS/CSS when a browser fires many concurrent requests on a freshly
    # created session during cold boot (right after a restart) -> /qapps blanks. Retry only applies
    # where proxy_next_upstream is set (the static-asset locations = idempotent GETs), so the dynamic
    # moqui_backend (1 server) never retries and no POST/billing request is ever double-executed.
    upstream moqui_static {
        server 127.0.0.1:8080 max_fails=0;
        server 127.0.0.1:8080 max_fails=0;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 1000;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Logging Settings
    access_log /var/log/nginx/access.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        font/woff2
        image/svg+xml
        image/x-icon;

    # Virtual Host Configs
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
