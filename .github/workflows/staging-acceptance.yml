# Phase-1 of the auto-deploy proposal (docs/infra/auto-deploy-proposal.md): REPORT-ONLY.
#
# Boots an ephemeral staging stack from the repo's OWN prebuilt, sanitized app image (published as
# the `staging-image-v1` release asset — no third-party GHCR pull, which is 403-blocked), overlays
# the checked-out component tree (exactly how a prod deploy applies changes), and renders a smoke
# set on /apps and /qapps. It NEVER touches production and has no prod credentials. A red run means
# "this change does not boot/render cleanly" — surface it, don't deploy.
#
# Trigger is workflow_dispatch (manual) ON PURPOSE while this is being tuned, so it can't spam
# failing required checks. Once reliably green, enable the pull_request / push triggers below.
name: staging-acceptance

on:
  workflow_dispatch: {}
  # Enable once reliably green (proposal Phase 1 -> Phase 2):
  # pull_request:
  #   branches: [master]
  # push:
  #   branches: [master]

permissions:
  contents: read            # enough to download the private release asset via GITHUB_TOKEN

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_RELEASE: staging-image-v1
  IMAGE_ASSET: zetaerp-moqui-local.tar.gz
  COMPOSE: docs/infra/ci/docker-compose.staging.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the sanitized staging image
        run: gh release download "$IMAGE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$IMAGE_ASSET" --dir "$RUNNER_TEMP"

      - name: Load the image
        run: |
          set -euo pipefail
          loaded=$(docker load -i "$RUNNER_TEMP/$IMAGE_ASSET" | sed -n 's/^Loaded image: //p' | head -1)
          echo "loaded: $loaded"
          docker tag "$loaded" zetaerp-moqui:staging

      - name: Boot ephemeral staging stack
        run: docker compose -f "$COMPOSE" up -d

      - name: Overlay the checked-out component tree
        # The baked image is a baseline Moqui+app; overlay the CURRENT repo components so staging runs
        # exactly this commit's code (merge-overlay — new/changed files win; deletions are not pruned,
        # which is fine for a render smoke). Then restart so Moqui reloads XML/Groovy.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          tar czf - component | docker exec -i "$CID" sh -c 'cd /opt/moqui/runtime/component && tar xzf - --strip-components=1'
          docker compose -f "$COMPOSE" restart moqui

      - name: Load seed data
        # Fresh DB is empty -> no login. Load Moqui seed+demo so john.doe/moqui exists.
        # This image is an EXPLODED Moqui runtime launched as `java -cp . MoquiStart` from /opt/moqui,
        # and java is at /opt/java/openjdk/bin/java (not on the exec PATH). Datasource comes from the
        # entity_ds_* env already set on the container.
        run: |
          set -x
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" sh -lc 'cd /opt/moqui && /opt/java/openjdk/bin/java -cp . MoquiStart load types=seed,seed-initial,demo' \
            || echo "::warning::seed load failed — see logs"

      - name: Wait for Moqui to be healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u john.doe:moqui http://localhost:8080/apps/zenith || true)
            [ "$code" = "200" ] && { echo "up after $i"; exit 0; }
            sleep 5
          done
          echo "::error::Moqui did not become healthy (auth/seed?)"; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer@23 --no-save

      - name: Render smoke (both surfaces)
        run: node docs/infra/ci/smoke.mjs http://localhost:8080

      # --- follow-up acceptance (next increment), see docs/infra/auto-deploy-proposal.md ---
      # - name: Org-isolation asserts         # tenant A cannot see tenant B (DB ground truth)
      # - name: MARUTHI-shaped billing smoke   # cash/card/split sale -> bill mints, pricing/tax == baseline

      - name: Dump Moqui logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE" logs --tail=200 moqui || true

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true
