# Phase-1 of the auto-deploy proposal (docs/infra/auto-deploy-proposal.md): REPORT-ONLY.
#
# Boots an ephemeral staging stack from a clean runtime image assembled without production
# image layers (`staging-image-clean-v1`), verifies its pinned checksum, overlays the checked-out
# component tree (as a prod deploy does), seeds demo data, and renders a smoke set on /apps + /qapps.
# NEVER touches production and has no prod credentials. Red = this change doesn't boot/render cleanly.
#
# Runs for PRs and master, with manual dispatch available for diagnosis.
name: staging-acceptance

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master]
  push:                 # on-merge runs: re-check the merged result on master (no PR comment on push)
    branches: [master]

permissions:
  contents: read
  pull-requests: write      # to post/update the sticky PR comment on failure (same-repo PRs)

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_RELEASE: staging-image-clean-v1
  IMAGE_ASSET: zetaerp-moqui-clean.tar.gz
  IMAGE_SHA256: 0305b2d2f7124781c41de04eb8aa8a7847ee5116ee01f09dc52d7f12dc513b93
  COMPOSE: docs/infra/ci/docker-compose.staging.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the clean staging image
        run: gh release download "$IMAGE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$IMAGE_ASSET" --dir "$RUNNER_TEMP"

      - name: Verify the clean image before loading
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Clean image checksum is not pinned"; exit 1; }
          actual=$(sha256sum "$RUNNER_TEMP/$IMAGE_ASSET" | cut -d ' ' -f 1)
          if [ "$actual" = "2da7d916054bf4fccf9c6d32e97b2b2afa0d9ae3531d2a004a4bd87dcf59b18c" ]; then
            echo "::error::Refusing the known unsafe original image archive"; exit 1
          fi
          printf '%s  %s\n' "$IMAGE_SHA256" "$RUNNER_TEMP/$IMAGE_ASSET" | sha256sum --check --strict -

      - name: Load the image
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/$IMAGE_ASSET" > "$RUNNER_TEMP/image-load.txt"
          loaded=$(sed -n 's/^Loaded image: //p' "$RUNNER_TEMP/image-load.txt")
          [ "$loaded" = "zetaerp-moqui:clean-staging" ] || { echo "::error::Unexpected clean runtime image tag"; exit 1; }
          echo "loaded: $loaded"
          docker tag "$loaded" zetaerp-moqui:staging

      - name: Boot stack
        # The CI-only compose command keeps HTTP idle until overlays and the loader finish.
        run: docker compose -f "$COMPOSE" up -d

      - name: Overlay the checked-out component tree
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" sh -c 'rm -rf /opt/moqui/runtime/component/zenith-erp-*'
          tar czf - component | docker exec -i "$CID" sh -c 'cd /opt/moqui/runtime/component && tar xzf - --strip-components=1'

      - name: Overlay base-component webroot overrides
        # Login.xml / Login.ftl / qapps.xml are ZetaERP's base-component customizations that prod
        # bind-mounts at runtime, so `docker commit` never baked them into the image -> the stock
        # /qapps redirects loop. Copy the committed staging snapshots in so staging == prod.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          for f in Login.xml Login.ftl qapps.xml; do
            docker cp "docs/infra/ci/base-overrides/$f" "$CID:/opt/moqui/runtime/base-component/webroot/screen/webroot/$f"
          done

      - name: Overlay repository runtime classes and framework patches
        # The clean runtime has no application-specific classes or production-derived patches.
        # Apply this checkout's versions before loading data and restarting for render checks.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker cp docs/infra/zenith-classes/. "$CID:/opt/moqui/runtime/classes/"
          docker cp docs/infra/framework-patches "$CID:/tmp/ci-framework-patches"
          docker exec "$CID" sh -c '
            set -eu
            P=/tmp/ci-framework-patches
            sh "$P/patch-webroot-nav.sh"
            sh "$P/patch-webroot-breadcrumb.sh"
            sh "$P/patch-webroot-qavatar.sh"
            sh "$P/patch-log4j2-authzfilter.sh"
            for asset in WebrootVue.qvt.js WebrootVue.qvt.min.js; do
              F=/opt/moqui/runtime/base-component/webroot/screen/webroot/js/$asset
              sh "$P/patch-webroot-lazy-rules.sh" "$F"
              sh "$P/patch-webroot-inr-grid.sh" "$F"
            done
            for surface in html vuet qvt; do
              sh "$P/patch-macro-inr.sh" "/opt/moqui/runtime/template/screen-macro/DefaultScreenMacros.$surface.ftl"
            done
          '

      - name: Install the CI-only isolation fixture component
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" mkdir -p /opt/moqui/runtime/component/ci-staging-fixtures/data
          docker cp docs/infra/ci/seed/component.xml "$CID:/opt/moqui/runtime/component/ci-staging-fixtures/component.xml"
          docker cp docs/infra/ci/seed/isolation.xml "$CID:/opt/moqui/runtime/component/ci-staging-fixtures/data/CiIsolationDemoData.xml"

      - name: Load discovered seed, demo and isolation fixtures in one invocation
        # Exploded Moqui runtime: java -cp . MoquiStart from /opt/moqui; java at /opt/java/openjdk/bin/java.
        # An explicit location bypasses normal component/framework data discovery, even with types.
        # The temporary component depends on contacts, so its demo fixture loads after prerequisites.
        # The loader can skip individual unrelated files; required records are asserted below.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" sh -lc 'cd /opt/moqui && /opt/java/openjdk/bin/java -cp . MoquiStart load types=seed,seed-initial,demo no-run-es' \
            2>&1 | tee "$RUNNER_TEMP/seed.txt"

      - name: Assert required seed and tenant records in the fresh database
        run: |
          set -euo pipefail
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          docker exec -i "$DBID" psql -U moqui -d moqui -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM user_account WHERE user_id='EX_JOHN_DOE' AND username='john.doe' AND disabled='N' AND party_id='EX_JOHN_DOE') THEN
              RAISE EXCEPTION 'Required active demo login or synthetic party association is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM user_group_member WHERE user_id='EX_JOHN_DOE' AND user_group_id IN ('ADMIN','ZENITH_ADMIN') AND (thru_date IS NULL OR thru_date>CURRENT_TIMESTAMP)) THEN
              RAISE EXCEPTION 'Required demo admin module access is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM user_preference WHERE user_id='EX_JOHN_DOE' AND preference_key='ACTIVE_ORGANIZATION' AND preference_value='CITEST_ORG_A') THEN
              RAISE EXCEPTION 'Required active synthetic organization preference is missing';
            END IF;
            IF (SELECT COUNT(*) FROM party_role WHERE party_id IN ('CITEST_ORG_A','CITEST_ORG_B') AND role_type_id='OrgInternal')<>2 THEN
              RAISE EXCEPTION 'Synthetic internal organization roles are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM party_relationship WHERE party_relationship_id='CITEST_REL_JD_A' AND from_party_id='EX_JOHN_DOE' AND to_party_id='CITEST_ORG_A' AND relationship_type_enum_id='PrtAgent' AND to_role_type_id='OrgInternal') THEN
              RAISE EXCEPTION 'Synthetic organization agent relationship is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM party p JOIN person n ON n.party_id=p.party_id WHERE p.party_id='CITEST_A_CUST' AND p.owner_party_id='CITEST_ORG_A' AND n.last_name='CITestOnlyInTenantA')
              OR NOT EXISTS (SELECT 1 FROM party p JOIN person n ON n.party_id=p.party_id WHERE p.party_id='CITEST_B_CUST' AND p.owner_party_id='CITEST_ORG_B' AND n.last_name='CITestOnlyInTenantB') THEN
              RAISE EXCEPTION 'Required tenant-owned synthetic contacts are missing';
            END IF;
          END $$;
          SQL
          echo "Required login, organization and contact fixture records are present"

      - name: Start Moqui after overlays and verified seed data
        # One JVM owns the Bitronix journal/schema at a time; the loader has exited now.
        run: docker compose -f "$COMPOSE" exec -T moqui touch /tmp/ci-start-moqui

      - name: Wait for Moqui to respond
        run: |
          for i in $(seq 1 48); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/Login/login || true)
            [ -n "$code" ] && [ "$code" != "000" ] && { echo "responding ($code) after $i"; exit 0; }
            sleep 5
          done
          echo "::error::Moqui never responded"; exit 1

      - name: Diagnose login + data state
        # Non-fatal, always runs: prints exactly what's in the DB and what the login returns, so the
        # seed fixtures can be built precisely instead of guessing across runs.
        if: always()
        run: |
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          q(){ docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c "$1" 2>&1 || true; }
          echo "=== john.doe UserAccount ==="; q "SELECT user_id,username,disabled,require_password_change,password_hash_type FROM user_account WHERE username='john.doe';"
          echo "=== john.doe groups ==="; q "SELECT user_group_id FROM user_group_member WHERE user_id='EX_JOHN_DOE';"
          echo "=== some organizations ==="; q "SELECT party_id FROM party WHERE party_type_enum_id='PtyOrganization' LIMIT 8;"
          echo "=== parties owned (owner -> count) ==="; q "SELECT owner_party_id, count(*) FROM party WHERE owner_party_id IS NOT NULL GROUP BY owner_party_id ORDER BY 2 DESC LIMIT 8;"
          echo "=== john.doe active-org pref ==="; q "SELECT preference_value FROM user_preference WHERE user_id='EX_JOHN_DOE' AND preference_key='ACTIVE_ORGANIZATION';"
          echo "=== GET /apps/zenith (authed) ==="; curl -s -o /dev/null -w 'code=%{http_code} redirect=%{redirect_url}\n' -u john.doe:moqui http://localhost:8080/apps/zenith || true
          echo "=== body snippet ==="; curl -s -u john.doe:moqui http://localhost:8080/apps/zenith | tr '\n' ' ' | head -c 700; echo

      - name: Assert login works (gate)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -u john.doe:moqui http://localhost:8080/apps/zenith || true)
          [ "$code" = "200" ] || { echo "::error::login/module access not 200 (got $code) — see diagnostics"; exit 1; }

      - name: Org-isolation assert
        # As john.doe (active org = CI Tenant A), the contacts list must show Tenant A's contact and
        # NOT Tenant B's — validates live active-org scoping (catches a gross isolation regression).
        # TODO once #14 is merged: add the stronger no-org-empty + forged-?ownerPartyId asserts that
        # #14 fixes (they'd red the current pre-#14 master, so they wait).
        run: |
          html=$(curl -s -u john.doe:moqui 'http://localhost:8080/apps/zenith/Contacts/FindContact')
          echo "$html" | grep -q 'CITestOnlyInTenantA' || { echo "::error::isolation: Tenant A's own contact is missing (active-org scoping broken, or the pref was stripped)"; exit 1; }
          if echo "$html" | grep -q 'CITestOnlyInTenantB'; then echo "::error::ISOLATION LEAK — Tenant B's contact is visible to Tenant A"; exit 1; fi
          echo "OK — org-isolation holds: Tenant A sees its own contact, not Tenant B's"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer@23 --no-save

      - name: Render smoke (both surfaces)
        run: |
          set -o pipefail
          node docs/infra/ci/smoke.mjs http://localhost:8080 | tee "$RUNNER_TEMP/smoke.txt"

      - name: Dump Moqui logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE" logs --tail=200 moqui || true

      - name: PR comment — failed (sticky)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- staging-acceptance-sticky -->'
          FAILS=$(grep -E 'FAIL|SMOKE FAILED' "$RUNNER_TEMP/smoke.txt" 2>/dev/null | sed 's/^/- /' || true)
          BODY=$(printf '%s\n### ❌ staging-acceptance failed\nThis change does not boot/render cleanly on the ephemeral staging stack.\n\n%s\n\n[View the run](%s) · report-only (not a merge gate on this plan).\n' \
            "$MARKER" "${FAILS:-See the run for details.}" "$RUN_URL")
          cid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$cid" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$BODY" >/dev/null && echo "updated $cid";
          else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null && echo created; fi || echo "could not comment (token perms — e.g. a fork PR?)"

      - name: PR comment — passed (clear sticky)
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- staging-acceptance-sticky -->'
          cid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            BODY=$(printf '%s\n### ✅ staging-acceptance passed\nRenders cleanly on /apps and /qapps.\n\n[View the run](%s)\n' "$MARKER" "$RUN_URL")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$BODY" >/dev/null && echo "flipped $cid to pass" || echo "could not update"
          else echo "no sticky comment to clear"; fi

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true
