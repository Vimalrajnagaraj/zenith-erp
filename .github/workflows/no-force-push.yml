name: no-force-push-to-master

# Free-plan approximation of "protect this branch from force pushing".
#
# GitHub only *blocks* force-pushes on private repos under a PAID plan, so this instead runs on
# every push to master and FAILS (a loud red ❌) when the push was a FORCE push — i.e. someone
# rewrote master's shared history. It is an after-the-fact alarm, not a hard block: the rewrite
# has already happened by the time this runs, so treat a failure as "restore master's previous
# tip right now" using the command printed below.
#
# Applies to EVERYONE, including the owner — force-pushing shared master is never part of normal
# work. Upgrade to GitHub Pro to actually block it.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  guard-force-push:
    # Only runs when the push rewrote history; a normal push skips this job (no red check).
    if: ${{ github.event.forced }}
    runs-on: ubuntu-latest
    steps:
      - name: Flag a force-push to master
        env:
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          echo "::error title=Force-push to master::'$ACTOR' force-pushed master, rewriting shared history (${BEFORE} -> ${AFTER})."
          echo ""
          echo "A force-push to master can erase other people's commits. If this was NOT intended,"
          echo "restore the previous tip immediately, from a clone that still has the old history"
          echo "(e.g. a teammate's, or your local reflog):"
          echo ""
          echo "    git push --force-with-lease origin ${BEFORE}:master"
          echo ""
          echo "Never force-push master as part of normal work — use a branch + PR."
          echo "See docs/SOP-commit-and-deploy.md and CONTRIBUTING.md."
          exit 1
