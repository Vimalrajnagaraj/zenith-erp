name: repo-guards

# Server-side belt-and-suspenders for the local pre-commit hook. The hook (docs/infra/git-hooks)
# only runs if a clone armed it via core.hooksPath and it's bypassable with --no-verify; this runs
# the same STATIC guards on GitHub for every push and PR, where it can't be skipped at setup.
# NOTE: dormant until this repo has a GitHub remote — GitHub Actions only run on github.com.
# lint-purge-vocabulary.sh is intentionally excluded (needs the Docker API, a runtime check).

on: [push, pull_request]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node (lint-css-comments parses CSS in JS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: lint-css-comments (stray */ in a CSS comment)
        run: sh docs/infra/lint-css-comments.sh

      - name: lint-party-picker (cross-tenant party type-ahead)
        run: sh docs/infra/lint-party-picker.sh

      - name: lint-cross-module-transitions (unregistered cross-module call)
        run: sh docs/infra/lint-cross-module-transitions.sh

      - name: lint-form-dom-collisions (form control shadows a DOM property)
        run: sh docs/infra/lint-form-dom-collisions.sh

      - name: Catalog-only clean workspace conversion
        run: python3 docs/infra/clean-workspace/test_prepare.py
