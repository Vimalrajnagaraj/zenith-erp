name: Claude Code

# Claude responds when someone writes "@claude" in an issue, a pull request, an issue/PR
# comment, or a PR review. It works on a branch and opens a PR (master is PR-only) — a direct
# push would trip the no-direct-push guard, since the bot is not on that allowlist.
#
# REQUIRES the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, value starts
# with sk-ant-oat01-). Set it via: gh secret set CLAUDE_CODE_OAUTH_TOKEN -R amalnathkp13-boop/zenith-erp
# Until that secret exists, this workflow will fail to authenticate — that is expected.
# Runs bill against the Claude account that minted the token.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when "@claude" is actually mentioned, so ordinary comments don't spend usage.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create branches / commits (never a direct push to master)
      pull-requests: write   # open and comment on PRs
      issues: write          # comment on issues
      id-token: write        # OIDC for the action
      actions: read          # read CI results on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
